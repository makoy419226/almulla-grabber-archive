name: Deploy to GoDaddy

on:
  push:
  workflow_dispatch:

concurrency:
  group: godaddy-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and upload static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build GoDaddy static site
        run: npm run build:godaddy

      - name: Validate GoDaddy static output
        run: |
          test -f godaddy-dist/index.html
          test -f godaddy-dist/contact-us/index.html
          test -f godaddy-dist/privacy-policy/index.html
          grep -q 'legacy-hero-grid' godaddy-dist/index.html
          grep -q 'hero-1280.webp' godaddy-dist/index.html
          grep -q 'justify-content: flex-start' godaddy-dist/index.html
          grep -q 'text-align: left' godaddy-dist/index.html
          if grep -q 'src/godaddy-main.tsx\|id="root"\|/assets/index-' godaddy-dist/index.html; then
            echo "Generated GoDaddy homepage contains the React app shell."
            exit 1
          fi
          if test -d godaddy-dist/assets; then
            echo "Generated GoDaddy upload contains bundled app assets."
            exit 1
          fi

      - name: Validate GoDaddy FTP secrets
        run: |
          test -n "${{ secrets.GODADDY_FTP_SERVER }}" || (echo "Missing GODADDY_FTP_SERVER" && exit 1)
          test -n "${{ secrets.GODADDY_FTP_USERNAME }}" || (echo "Missing GODADDY_FTP_USERNAME" && exit 1)
          test -n "${{ secrets.GODADDY_FTP_PASSWORD }}" || (echo "Missing GODADDY_FTP_PASSWORD" && exit 1)

      - name: Upload to GoDaddy hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_FTP_SERVER }}
          username: ${{ secrets.GODADDY_FTP_USERNAME }}
          password: ${{ secrets.GODADDY_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./godaddy-dist/
          server-dir: /
